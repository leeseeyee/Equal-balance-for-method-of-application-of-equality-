<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>EquaBalance Scale - Linear Equations</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

  <style>
    body {
      font-family: 'Outfit', sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      touch-action: manipulation;
    }
    .font-fredoka { font-family: 'Fredoka', sans-serif; }

    /* Custom Scrollbar */
    .chalkboard-scroll::-webkit-scrollbar { width: 6px; }
    .chalkboard-scroll::-webkit-scrollbar-track { background: #1e293b; border-radius: 4px; }
    .chalkboard-scroll::-webkit-scrollbar-thumb { background: #475569; border-radius: 4px; }

    /* Scale Physics Animations */
    #scale-beam-group, #scale-pan-left-group, #scale-pan-right-group, #dial-needle {
      transition: transform 0.7s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* Hand Pointer Animations */
    .hand-anim {
      transition: transform 0.4s ease, opacity 0.3s ease;
      opacity: 0;
      pointer-events: none;
    }
    .hand-anim.active {
      opacity: 1;
      transform: translateY(-10px) scale(1.1);
    }

    /* Solid x Cube (+x) */
    .cube-x {
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), inset -2px -2px 4px rgba(0, 0, 0, 0.4), inset 2px 2px 4px rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      border: 1px solid #818cf8;
      position: relative;
    }

    /* Fractional x block */
    .cube-sliced-container {
      background: linear-gradient(135deg, #c026d3 0%, #9333ea 100%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), inset -2px -2px 4px rgba(0, 0, 0, 0.4), inset 2px 2px 4px rgba(255, 255, 255, 0.3);
      border-radius: 6px;
      border: 1.5px dashed #f5d0fe;
    }

    /* Positive Unit Block (+1) */
    .sphere-unit {
      background: linear-gradient(135deg, #10b981 0%, #047857 100%);
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.3), inset -2px -2px 4px rgba(0, 0, 0, 0.4), inset 2px 2px 4px rgba(255, 255, 255, 0.3);
      border-radius: 50%;
      border: 1px solid #34d399;
    }

    /* Negative Unit Cutout Hole (-1) */
    .hole-unit {
      background: rgba(15, 23, 42, 0.9);
      border: 2px dashed #ef4444;
      color: #f87171;
      box-shadow: inset 2px 2px 6px rgba(0, 0, 0, 0.95), 0 0 6px rgba(239, 68, 68, 0.4);
      border-radius: 50%;
      position: relative;
    }

    /* Speech Bubble Animation */
    .speech-bubble {
      animation: floatBubble 2s infinite ease-in-out;
    }
    @keyframes floatBubble {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 md:p-6 bg-slate-900 text-slate-100">

              <!-- Main Crossbar Beam -->

        <div id="board-steps" class="chalkboard-scroll my-3 flex-1 min-h-[180px] max-h-[250px] overflow-y-auto flex flex-col gap-2 font-mono text-xs md:text-sm text-slate-300">

    </div>

    <!-- Bottom Operations Toolbar -->
    <section class="bg-slate-800/80 p-4 rounded-2xl border border-slate-700 shadow-lg backdrop-blur flex flex-col gap-3">
      <div class="flex flex-col sm:flex-row items-start sm:items-center justify-between gap-2">
        <h3 class="text-xs font-bold uppercase tracking-wider text-indigo-300 flex items-center gap-1.5">
          <span>⚡</span> Action Target Side:
        </h3>
        
        <!-- Target Mode Selector (Both Sides vs Left Only vs Right Only) -->
        <div class="flex items-center gap-1 bg-slate-950 p-1 rounded-xl border border-slate-700 w-full sm:w-auto">
          <button id="target-both" class="flex-1 sm:flex-none px-3 py-1 bg-indigo-600 text-white font-bold rounded-lg text-xs transition">
            ⚖️ Both Sides (Equal)

          <button id="target-left" class="flex-1 sm:flex-none px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-xs transition">
            👈 Left Side Only

          <button id="target-right" class="flex-1 sm:flex-none px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-xs transition">

      <!-- Action Buttons -->
      <div class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-6 gap-2">
        <button id="btn-add-1" class="px-3 py-2.5 bg-emerald-700 hover:bg-emerald-600 active:scale-95 text-white font-semibold rounded-xl text-xs md:text-sm transition flex items-center justify-center gap-1 shadow-md">

          <span>- 1</span>
        </button>
        <button id="btn-add-x" class="px-3 py-2.5 bg-indigo-700 hover:bg-indigo-600 active:scale-95 text-white font-semibold rounded-xl text-xs md:text-sm transition flex items-center justify-center gap-1 shadow-md">
          <span>+ x</span>
        </button>
        <button id="btn-sub-x" class="px-3 py-2.5 bg-purple-700 hover:bg-purple-600 active:scale-95 text-white font-semibold rounded-xl text-xs md:text-sm transition flex items-center justify-center gap-1 shadow-md">

          <button id="btn-mul-n" class="flex-1 py-1.5 bg-cyan-700 hover:bg-cyan-600 active:scale-95 text-white font-bold rounded-lg text-xs transition">
            × n

  </div>

  <!-- Audio Synthesis Engine -->
  <script>
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playSound(freq = 440, type = 'sine', duration = 0.15) {
      try {
        if (!audioCtx) audioCtx = new AudioCtx();
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + duration);
      } catch (e) {}
    }
  </script>

  <!-- Main Logic & Algebra Solver Engine -->
  <script>
    let leftState = { xCoef: 1, unitVal: 0 };
    let rightState = { xCoef: 0, unitVal: 0 };
    let stepLogs = [];
    let activeTargetMode = 'both'; // 'both', 'left', 'right'

    // Value of x calculated from initial equation
    let solvedXValue = 1;

    function parseSide(sideStr) {
      let xCoef = 0;
      let unitVal = 0;
      
      const cleaned = sideStr.replace(/\s+/g, '');
      if (!cleaned) return { xCoef, unitVal };

      const regex = /([+-]?(?:\d+\/\d+|\d*\.\d+|\d+)?x)|([+-]?\d+)/gi;
      let match;

      while ((match = regex.exec(cleaned)) !== null) {
        if (match[1]) {
          let term = match[1].toLowerCase().replace('x', '');
          if (term === '' || term === '+') xCoef += 1;
          else if (term === '-') xCoef -= 1;
          else if (term.includes('/')) {
            const parts = term.split('/');
            xCoef += parseFloat(parts[0]) / parseFloat(parts[1]);
          } else {
            xCoef += parseFloat(term);
          }
        } else if (match[2]) {
          unitVal += parseFloat(match[2]);
        }
      }

      return { xCoef, unitVal };
    }

    function parseEquation(eqStr) {
      const parts = eqStr.split('=');
      if (parts.length !== 2) return null;
      const left = parseSide(parts[0]);
      const right = parseSide(parts[1]);

      const xDiff = left.xCoef - right.xCoef;
      const uDiff = right.unitVal - left.unitVal;
      if (xDiff !== 0) {
        solvedXValue = uDiff / xDiff;
      } else {
        solvedXValue = 1;
      }

      return { left, right };
    }

    // Dynamic Physical Weight: Weight = xCoef * solvedXValue + unitVal
    function getWeights() {
      const leftW = leftState.xCoef * solvedXValue + leftState.unitVal;
      const rightW = rightState.xCoef * solvedXValue + rightState.unitVal;
      return { leftW, rightW, diff: leftW - rightW };
    }

    function formatSideText(state) {
      let parts = [];

      if (state.xCoef !== 0) {
        if (state.xCoef === 1) parts.push('x');
        else if (state.xCoef === -1) parts.push('-x');
        else if (Math.abs(state.xCoef - 0.5) < 0.01) parts.push('½x');
        else if (Math.abs(state.xCoef - 0.33) < 0.01) parts.push('⅓x');
        else if (Math.abs(state.xCoef - 0.25) < 0.01) parts.push('¼x');
        else parts.push(`${Number(state.xCoef.toFixed(2))}x`);
      }

      if (state.unitVal !== 0 || parts.length === 0) {
        if (state.unitVal > 0) {
          if (parts.length > 0) parts.push(`+ ${state.unitVal}`);
          else parts.push(`${state.unitVal}`);
        } else if (state.unitVal < 0) {
          if (parts.length > 0) parts.push(`- ${Math.abs(state.unitVal)}`);
          else parts.push(`${state.unitVal}`);
        } else if (parts.length === 0) {
          parts.push('0');
        }
      }

      return parts.join(' ');
    }

    // Render Pan Items (+1 sphere, -1 hole cutout, positive x cube, fractional x)
    function renderPan(containerId, state) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';

      const absX = Math.abs(state.xCoef);
      const absUnit = Math.abs(state.unitVal);
      const totalCount = absX + absUnit;

      // Smart Responsive Dynamic Item Size Calculation
      let sizeClass = "w-7 h-7 text-xs";
      let sizePx = 28;
      if (totalCount > 8) { sizeClass = "w-6 h-6 text-[10px]"; sizePx = 24; }
      if (totalCount > 12) { sizeClass = "w-5 h-5 text-[8px]"; sizePx = 20; }
      if (totalCount > 16) { sizeClass = "w-4 h-4 text-[7px]"; sizePx = 16; }

      // 1. Render x Cubes
      if (state.xCoef > 0) {
        const fullCubes = Math.floor(state.xCoef);
        for (let i = 0; i < fullCubes; i++) {
          const cube = document.createElement('div');
          cube.className = `${sizeClass} cube-x text-white font-fredoka flex items-center justify-center shadow select-none flex-shrink-0`;
          cube.innerText = 'x';
          container.appendChild(cube);
        }

        const frac = state.xCoef % 1;
        if (frac > 0.05) {
          const fracVal = Number(frac.toFixed(2));
          const fracCube = document.createElement('div');
          const fracWidthPx = Math.max(14, Math.round(sizePx * Math.min(fracVal, 0.85)));
          
          fracCube.className = `cube-sliced-container text-fuchsia-100 font-fredoka flex items-center justify-center shadow select-none flex-shrink-0`;
          fracCube.style.height = `${sizePx}px`;
          fracCube.style.width = `${fracWidthPx}px`;
          fracCube.style.fontSize = sizePx <= 20 ? '8px' : '10px';

          let fracText = `${fracVal}x`;
          if (Math.abs(fracVal - 0.5) < 0.05) fracText = '½x';
          else if (Math.abs(fracVal - 0.33) < 0.05) fracText = '⅓x';
          else if (Math.abs(fracVal - 0.25) < 0.05) fracText = '¼x';

          fracCube.innerText = fracText;
          container.appendChild(fracCube);
        }
      }

      // 2. Render Units (+1 Spheres vs -1 Hole Cutouts)
      if (state.unitVal > 0) {
        const units = Math.round(state.unitVal);
        for (let i = 0; i < units; i++) {
          const sphere = document.createElement('div');
          sphere.className = `${sizeClass} sphere-unit text-white font-fredoka flex items-center justify-center shadow select-none flex-shrink-0`;
          sphere.innerText = '1';
          container.appendChild(sphere);
        }
      } else if (state.unitVal < 0) {
        // Cutout Hole Spheres (-1)
        const holeUnits = Math.abs(Math.round(state.unitVal));
        for (let i = 0; i < holeUnits; i++) {
          const holeSphere = document.createElement('div');
          holeSphere.className = `${sizeClass} hole-unit font-fredoka flex items-center justify-center shadow select-none flex-shrink-0`;
          holeSphere.innerText = '-1';
          holeSphere.title = "Cutout hole (-1 weight)";
          container.appendChild(holeSphere);
        }
      }
    }

    // Scale Physics Update (Tilt Beam based on actual weight difference)
    function updateScalePhysics() {
      const { diff } = getWeights();
      const maxAngle = 14;
      const angle = Math.max(-maxAngle, Math.min(maxAngle, diff * 2.5));

      document.getElementById('scale-beam-group').style.transform = `rotate(${angle}deg)`;
      document.getElementById('scale-pan-left-group').style.transform = `rotate(${-angle}deg)`;
      document.getElementById('scale-pan-right-group').style.transform = `rotate(${-angle}deg)`;
      document.getElementById('dial-needle').style.transform = `rotate(${angle * 1.5}deg)`;

      const bubble = document.getElementById('speech-bubble');
      const mascotText = document.getElementById('mascot-text');
      const statusEl = document.getElementById('equation-status');

      if (Math.abs(diff) < 0.01) {
        statusEl.innerText = "BALANCED";
        statusEl.className = "text-emerald-400 font-bold";
        mascotText.innerText = "Scale is balanced! Equality is preserved.";
        bubble.className = "speech-bubble bg-emerald-900/90 border border-emerald-500 text-emerald-200 text-xs px-3 py-1.5 rounded-xl shadow-md flex items-center gap-2";

        if ((leftState.xCoef === 1 && leftState.unitVal === 0 && rightState.xCoef === 0) ||
            (rightState.xCoef === 1 && rightState.unitVal === 0 && leftState.xCoef === 0)) {
          confetti({ particleCount: 80, spread: 60, origin: { y: 0.7 } });
          playSound(587.33, 'sine', 0.4);
        }
      } else {
        statusEl.innerText = "UNBALANCED";
        statusEl.className = "text-rose-400 font-bold";
        if (diff > 0) {
          mascotText.innerText = "⚠️ Unbalanced! Left side is heavier.";
        } else {
          mascotText.innerText = "⚠️ Unbalanced! Right side is heavier.";
        }
        bubble.className = "speech-bubble bg-rose-900/90 border border-rose-500 text-rose-200 text-xs px-3 py-1.5 rounded-xl shadow-md flex items-center gap-2";
        playSound(220, 'sawtooth', 0.1);
      }
    }

    function logStep(opText) {
      const leftStr = formatSideText(leftState);
      const rightStr = formatSideText(rightState);

      const eqSymbol = Math.abs(getWeights().diff) < 0.01 ? '=' : '≠';

      stepLogs.push({ type: opText, leftStr, rightStr, eqSymbol });
      renderBoard();
    }

    function renderBoard() {
      const board = document.getElementById('board-steps');
      board.innerHTML = '';

      stepLogs.forEach((log, index) => {
        const row = document.createElement('div');
        row.className = "flex flex-col items-center w-full";

        if (index > 0) {
          const arrow = document.createElement('div');
          arrow.className = log.eqSymbol === '≠' ? "text-rose-400 text-xs font-bold flex items-center gap-1 my-0.5" : "text-amber-400 text-xs font-bold flex items-center gap-1 my-0.5";
          arrow.innerText = log.type;
          row.appendChild(arrow);
        }

        const eqLine = document.createElement('div');
        eqLine.className = log.eqSymbol === '≠' ? "text-rose-300 tracking-wider font-bold" : "text-indigo-200 tracking-wider font-bold";
        eqLine.innerText = `${log.leftStr} ${log.eqSymbol} ${log.rightStr}`;
        row.appendChild(eqLine);

        board.appendChild(row);
      });

      board.scrollTop = board.scrollHeight;
    }

    function updateUI() {
      renderPan('pan-left-container', leftState);
      renderPan('pan-right-container', rightState);
      updateScalePhysics();
    }

    function triggerHandAnim(target) {
      const hLeft = document.getElementById('hand-left');
      const hRight = document.getElementById('hand-right');
      
      if (target === 'both' || target === 'left') hLeft.classList.add('active');
      if (target === 'both' || target === 'right') hRight.classList.add('active');
      
      setTimeout(() => {
        hLeft.classList.remove('active');
        hRight.classList.remove('active');
      }, 500);
    }

    // Target Selection Logic (Both, Left Only, Right Only)
    const btnBoth = document.getElementById('target-both');
    const btnLeft = document.getElementById('target-left');
    const btnRight = document.getElementById('target-right');
    const sideTipText = document.getElementById('side-tip-text');

    function setTargetMode(mode) {
      activeTargetMode = mode;
      btnBoth.className = mode === 'both' ? "flex-1 sm:flex-none px-3 py-1 bg-indigo-600 text-white font-bold rounded-lg text-xs transition" : "flex-1 sm:flex-none px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-xs transition";
      btnLeft.className = mode === 'left' ? "flex-1 sm:flex-none px-3 py-1 bg-indigo-600 text-white font-bold rounded-lg text-xs transition" : "flex-1 sm:flex-none px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-xs transition";
      btnRight.className = mode === 'right' ? "flex-1 sm:flex-none px-3 py-1 bg-indigo-600 text-white font-bold rounded-lg text-xs transition" : "flex-1 sm:flex-none px-3 py-1 bg-slate-800 hover:bg-slate-700 text-slate-300 font-bold rounded-lg text-xs transition";

      if (mode === 'both') {
        sideTipText.innerText = "Applying operations to BOTH sides keeps the scale balanced!";
      } else if (mode === 'left') {
        sideTipText.innerText = "⚠️ Operating on LEFT side ONLY will unbalance the scale!";
      } else {
        sideTipText.innerText = "⚠️ Operating on RIGHT side ONLY will unbalance the scale!";
      }
    }

    btnBoth.onclick = () => setTargetMode('both');
    btnLeft.onclick = () => setTargetMode('left');
    btnRight.onclick = () => setTargetMode('right');

    // Operations Execution Engine
    function applyOperation(opFn, labelText) {
      if (activeTargetMode === 'both' || activeTargetMode === 'left') {
        opFn(leftState);
      }
      if (activeTargetMode === 'both' || activeTargetMode === 'right') {
        opFn(rightState);
      }

      let opSideLabel = "↓ (Both) ";
      if (activeTargetMode === 'left') opSideLabel = "↓ (Left Only) ";
      if (activeTargetMode === 'right') opSideLabel = "↓ (Right Only) ";

      triggerHandAnim(activeTargetMode);
      playSound(440);
      logStep(opSideLabel + labelText);
      updateUI();
    }

    document.getElementById('btn-add-1').onclick = () => {
      applyOperation(state => state.unitVal++, '+ 1');
    };

    document.getElementById('btn-sub-1').onclick = () => {
      applyOperation(state => state.unitVal--, '- 1');
    };

    document.getElementById('btn-add-x').onclick = () => {
      applyOperation(state => state.xCoef++, '+ x');
    };

    document.getElementById('btn-sub-x').onclick = () => {
      applyOperation(state => state.xCoef--, '- x');
    };

    document.getElementById('btn-mul-n').onclick = () => {
      const n = parseFloat(document.getElementById('input-n').value) || 2;
      applyOperation(state => {
        state.xCoef *= n;
        state.unitVal *= n;
      }, `× ${n}`);
    };

    document.getElementById('btn-div-n').onclick = () => {
      const n = parseFloat(document.getElementById('input-n').value) || 2;
      if (n !== 0) {
        applyOperation(state => {
          state.xCoef /= n;
          state.unitVal /= n;
        }, `÷ ${n}`);
      }
    };

    function loadEquation(eqStr) {
      const parsed = parseEquation(eqStr);
      if (parsed) {
        leftState = parsed.left;
        rightState = parsed.right;
        stepLogs = [];
        setTargetMode('both');
        logStep('Initial Equation');
        updateUI();
      }
    }

    document.getElementById('btn-load').onclick = () => {
      loadEquation(document.getElementById('eq-input').value);
    };

    document.querySelectorAll('.btn-preset').forEach(btn => {
      btn.onclick = () => {
        const eq = btn.getAttribute('data-eq');
        document.getElementById('eq-input').value = eq;
        loadEquation(eq);
      };
    });

    document.getElementById('btn-reset').onclick = () => {
      loadEquation(document.getElementById('eq-input').value);
    };

    // Initial Load
    loadEquation('10x - 2 = 8');
  </script>
</body>
</html>
